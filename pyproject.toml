[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "CLI-приложение для симуляции торговли валютами"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.9.0,<1.0.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.valutatrade]
data_dir = "data"
users_file = "users.json"
portfolios_file = "portfolios.json"
rates_file = "rates.json"
history_file = "exchange_rates.json"

rates_ttl_seconds = 300
base_currency = "USD"

log_dir = "logs"
log_file = "actions.log"
log_level = "INFO"
log_format = "text"
log_max_bytes = 1048576
log_backup_count = 3
